<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>S2-1 Portrait et typographie dominante</title><link rel="stylesheet" href="base2.css"><style>
/* S2-1 — Portrait + typographie éditoriale dominante, composition intégrée.
   Polices : Cormorant Garamond + Jost. P1 détourée (BiRefNet + matting), échelle 0,92 du fichier x2.60. */
.cover{background:var(--ivoire)}
.t1{left:11mm;top:5mm;font-family:"Cormorant Garamond";font-weight:600;font-size:57mm;line-height:1;color:var(--brun);letter-spacing:-.025em;z-index:1}
.fig{left:68mm;top:78mm;width:153mm;height:227.8mm;background-image:url("../../03_photos_retouchees/serie2/P1_detoure_x2.60.png");z-index:2}
.t2{left:13mm;top:57mm;font-family:"Cormorant Garamond";font-style:italic;font-weight:500;font-size:33mm;line-height:.9;color:var(--terracotta);z-index:1;letter-spacing:-.005em}
.nom{left:13mm;top:131mm;z-index:3;color:var(--foret)}
.nom .a{display:block;font-family:Jost;font-weight:500;font-size:3.2mm;letter-spacing:.24em;text-transform:uppercase;color:var(--brun)}
.nom .b{display:block;font-family:"Cormorant Garamond";font-weight:700;font-size:19.5mm;line-height:.86;margin-top:2mm}
</style></head><body><div class="cover">
<h1 class="abs t1">L’Afrique</h1>
<div class="img fig"></div>
<p class="abs t2">dans mon<br>assiette</p>
<p class="abs nom"><span class="a">Les recettes de</span><span class="b">Mme<br>Fofana</span></p>
</div></body></html>

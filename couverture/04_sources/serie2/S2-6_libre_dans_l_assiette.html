<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>S2-6 Concept libre</title><link rel="stylesheet" href="base2.css"><style>
/* S2-6 — Concept libre : « dans mon assiette », au sens propre. Mme Fofana apparaît dans une assiette vue de face ;
   la main et la calebasse débordent du bord. P8 détourée, deux calques du MÊME fichier, à la même position :
   (1) découpé par le disque, (2) découpé autour de la main + calebasse. Aucun pixel déplacé ni créé.
   Polices : Fraunces + Jost. */
.cover{background:var(--ocre)}
.assiette{left:16mm;top:91mm;width:208mm;height:208mm;border-radius:50%;background:var(--ivoire);
  box-shadow:inset 0 0 0 5.5mm #EADBC0, 0 4mm 9mm rgba(60,35,15,.30)}
.figA{left:21mm;top:30mm;width:189.5mm;height:336.8mm;background-image:url("../../03_photos_retouchees/serie2/P8_detoure_x2.60.png")}
.figA{clip-path:circle(98mm at 99mm 165mm)}
.t{left:13mm;top:11mm;font-family:Fraunces;color:var(--brun);line-height:.86;font-variation-settings:"SOFT" 100,"WONK" 0}
.t .l1{display:block;font-weight:800;font-size:42mm;letter-spacing:-.03em;margin-left:-.03em}
.t .l2{display:block;font-style:italic;font-weight:500;font-size:23mm;letter-spacing:-.015em;margin-top:1mm;color:var(--ivoire)}
.nom{left:13mm;top:68mm;color:var(--brun)}
.nom .a{font-family:Jost;font-weight:600;font-size:3.3mm;letter-spacing:.24em;text-transform:uppercase}
.nom .b{font-family:Fraunces;font-weight:700;font-size:15mm;margin-left:2.5mm;font-variation-settings:"SOFT" 100}
</style></head><body><div class="cover">
<h1 class="abs t"><span class="l1">L’Afrique</span><span class="l2">dans mon assiette</span></h1>
<p class="abs nom"><span class="a">Les recettes de</span><span class="b">Mme Fofana</span></p>
<div class="abs assiette"></div>
<div class="img figA"></div>
</div></body></html>

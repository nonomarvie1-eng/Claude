<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>S2-5 Beau livre gastronomique</title><link rel="stylesheet" href="base2.css"><style>
/* S2-5 — Composition éditoriale audacieuse (beau livre gastronomique) : l'assiette entre dans le mot « assiette ».

.cover{background:var(--brun)}

.t .l1{display:block;font-weight:600;font-size:43mm;letter-spacing:-.02em;font-variation-settings:"opsz" 96}

.t .l3{display:block;font-style:italic;font-weight:500;font-size:52mm;letter-spacing:-.02em;margin-top:-1mm;color:var(--ocre-clair);font-variation-settings:"opsz" 96}
.plat{left:64mm;top:131mm;width:215.6mm;height:209.6mm;background-image:url("../../03_photos_retouchees/serie2/P6_assiette_detouree_x2.50.png");z-index:2;filter:drop-shadow(0 3mm 5mm rgba(0,0,0,.45))}

<h1 class="abs t"><span class="l1">L’Afrique</span><span class="l2">dans mon</span><span class="l3">assiette</span></h1>

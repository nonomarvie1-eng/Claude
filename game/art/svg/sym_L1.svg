  <filter id="comic" x="-20%" y="-20%" width="150%" height="150%">
    <feOffset dx="5" dy="6" in="SourceAlpha" result="o"/><feFlood flood-color="#000" flood-opacity=".38"/><feComposite in2="o" operator="in" result="s"/>

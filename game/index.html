<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#06150f" />
    <meta name="description" content="ACE! — démonstration jouable, crédits fictifs sans valeur monétaire." />
    <title>ACE!</title>
    <style>html,body{margin:0;height:100%;background:#071826;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
      #preboot{position:fixed;inset:0;z-index:40;background:#071826}
      #preboot .pb-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
      #preboot .pb-bd{display:none}
      @media (min-aspect-ratio:941/1672){#preboot .pb-bg{object-fit:contain}#preboot .pb-bd{display:block;position:absolute;inset:-5%;width:110%;height:110%;object-fit:cover;filter:blur(18px) brightness(.5)}}
      /* same geometry as render/intro.ts: bar 53 % of min(100vw, 56.25vh), centred at 29 % height */
      #preboot .pb-bar{position:absolute;left:50%;top:29%;width:calc(.53*min(100vw,56.25vh));width:calc(.53*min(100vw,56.25dvh));transform:translate(-50%,-50%)}
      #preboot .pb-track{display:block;width:100%;height:auto}
      #preboot .pb-ball{position:absolute;left:7.73%;top:51.3%;width:12.25%;transform:translate(-50%,-50%)}
      @media (prefers-reduced-motion:no-preference){#preboot .pb-ball{animation:pbb 1.6s ease-in-out infinite}}
      @keyframes pbb{50%{filter:brightness(1.12)}}</style>
  </head>
  <body>
    <!-- pre-boot: the real night stadium shows from the first bytes, before the game script
         has arrived (no fake progress here: the real progress starts with the script) -->
    <!-- pre-boot: the same composition as the loading scene (stadium, bar, ball at the start of
         the track), painted from the first bytes; no progress is shown here (none is measurable yet) -->
    <div id="preboot" aria-hidden="true">
      <img class="pb-bd" alt="" />
      <img class="pb-bg" src="/src/assets/img/loading_stadium.webp" alt="" fetchpriority="high" decoding="async" />
      <script>(function(){var b=document.querySelector('#preboot .pb-bg'),d=document.querySelector('#preboot .pb-bd');if(b&&d)d.src=b.currentSrc||b.src;})();</script>
      <div class="pb-bar"><img class="pb-track" src="/src/assets/img/loading_bar.webp" alt="" /><img class="pb-ball" src="/src/assets/img/loading_ball.webp" alt="" /></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
